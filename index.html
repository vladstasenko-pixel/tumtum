<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 350px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 32px;
    }

    p {
      margin-bottom: 25px;
      color: #bbb;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #6366f1;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hello World</h1>    
    <button id="btn">
      Нажми меня
    </button>
  </div>

  <script>
    const button = document.getElementById('btn');

    button.addEventListener('click', () => {
      alert('Кнопка работает!');
    });
  </script>

</body>
